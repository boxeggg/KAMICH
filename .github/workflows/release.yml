name: Release Android APK

# Releases on pushing a version tag, e.g. v1.0, v1.1
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kamich.keystore"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Publish signed APK
        run: |
          dotnet publish KAMICH/KAMICH.csproj -f net9.0-android -c Release \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/kamich.keystore" \
            -p:AndroidSigningKeyAlias=kamich \
            -p:AndroidSigningStorePass="$KEYSTORE_PASS" \
            -p:AndroidSigningKeyPass="$KEY_PASS"
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}

      - name: Collect APK
        run: |
          mkdir -p artifacts
          APK=$(find . -name "*-Signed.apk" | head -n 1)
          echo "Found APK: $APK"
          cp "$APK" "artifacts/kamich-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/kamich-${{ github.ref_name }}.apk
          generate_release_notes: true
